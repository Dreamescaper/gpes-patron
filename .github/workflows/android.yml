name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish releases for v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          # The version is computed from the commit count (version.json, app/build.gradle.kts): it needs the full history.
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # The default ('tools') no longer exists in the SDK repository.
          packages: platform-tools platforms;android-37.0 build-tools;37.0.0

      - uses: gradle/actions/setup-gradle@v4

      # Stable debug signature, so CI APKs install over each other and over local builds.
      # Optional: without the secret, Gradle generates a throwaway debug key.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "GPES_DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android | grep SHA256: | head -1

      # Upload key for Google Play (Play App Signing re-signs what is uploaded). Optional: without the secrets the release
      # bundle is still built (it checks R8), but unsigned.
      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        if: env.UPLOAD_KEYSTORE_B64 != ''
        run: |
          echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "GPES_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Test, lint, build
        env:
          GPES_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          GPES_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          GPES_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew --no-configuration-cache
          :core:test :recording:test
          :app:lintDebug :app:assembleDebug :app:bundleRelease
          :replay-cli:installDist

      - name: Name APK
        id: apk
        run: |
          version=$(./gradlew -q --no-configuration-cache :app:printVersion)   # "0.1.3+a1b2c3d (237)"
          version=${version// (/-}; version=${version%)}; version=${version//+/-}
          name="gpes-patron-${GITHUB_REF_NAME//\//-}-${version}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Name AAB
        id: aab
        run: |
          version=$(./gradlew -q --no-configuration-cache :app:printVersion)
          version=${version// (/-}; version=${version%)}; version=${version//+/-}
          signed=unsigned; [ -n "$GPES_UPLOAD_KEYSTORE" ] && signed=signed
          name="gpes-patron-${version}-${signed}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: ${{ steps.aab.outputs.name }}

      - name: Show signing certificate
        run: $ANDROID_HOME/build-tools/37.0.0/apksigner verify --print-certs "${{ steps.apk.outputs.name }}" | grep SHA-256

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests/
            recording/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
