name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish releases for v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Stable debug signature, so CI APKs install over each other and over local builds.
      # Optional: without the secret, Gradle generates a throwaway debug key.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        if: env.DEBUG_KEYSTORE_B64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Test, lint, build
        run: >
          ./gradlew --no-configuration-cache
          :core:test :recording:test
          :app:lintDebug :app:assembleDebug
          :replay-cli:installDist
          -PversionCode=${{ github.run_number }}

      - name: Name APK
        id: apk
        run: |
          short=$(git rev-parse --short HEAD)
          name="gpes-patron-${GITHUB_REF_NAME//\//-}-${{ github.run_number }}-${short}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.name }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            core/build/reports/tests/
            recording/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Release (v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
